<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  :root{
    --bg:#fbfaf9; --panel:#fff; --ink:#1a1a19; --muted:#6b6864;
    --line:#e5e1dc; --accent:#b5502a; --accent-soft:#f3e3dc;
    --ok:#2f6f4f; --radius:12px;
    --bar1:#b5502a; --bar2:#3d6b8e; --bar3:#6b7a3a; --bar4:#8a5a9b;
    --bar5:#b08326; --bar6:#4a7a76; --bar7:#9b4a5e; --bar8:#5a5f8a;
    color-scheme: light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 64px}
  h1{font-size:1.3rem;margin:0 0 4px;letter-spacing:-.01em}
  h2{font-size:1.05rem;margin:0 0 12px;letter-spacing:-.01em}
  p.sub{color:var(--muted);margin:0 0 24px;font-size:.92rem}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
  label{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
  input[type=text],textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
    font:inherit;background:#fff;color:var(--ink)
  }
  textarea{min-height:70px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  button{
    font:inherit;font-weight:500;cursor:pointer;border-radius:8px;
    border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px
  }
  button:hover{border-color:#cdc7c0}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.07)}
  button.ghost{background:transparent}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .opt-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .opt-row .tag{width:26px;height:26px;flex:0 0 26px;border-radius:6px;display:grid;place-items:center;font-size:.8rem;font-weight:600;color:#fff}
  .opt-row button{padding:6px 10px;flex:0 0 auto}
  .muted{color:var(--muted);font-size:.88rem}
  .divider{height:1px;background:var(--line);margin:20px 0}

  /* results */
  .qtext{font-size:1.45rem;font-weight:600;letter-spacing:-.015em;margin:0 0 20px;line-height:1.25}
  .bar{margin-bottom:14px}
  .bar-top{display:flex;justify-content:space-between;gap:12px;font-size:.95rem;margin-bottom:5px}
  .bar-label{display:flex;gap:8px;align-items:center;min-width:0}
  .bar-label .tag{width:22px;height:22px;flex:0 0 22px;border-radius:5px;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:#fff}
  .bar-label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-num{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--muted)}
  .bar-num b{color:var(--ink)}
  .track{height:14px;background:#efebe6;border-radius:7px;overflow:hidden}
  .fill{height:100%;border-radius:7px;width:0;transition:width .45s cubic-bezier(.2,.7,.3,1)}
  .total{font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted);margin-top:18px}

  /* join / QR */
  .join{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  #qr{background:#fff;padding:10px;border:1px solid var(--line);border-radius:10px;line-height:0}
  #qr img,#qr canvas{display:block}
  .code{font:600 2rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em}
  .url{font:.85rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);word-break:break-all}

  /* student */
  .choice{
    display:flex;gap:12px;align-items:center;width:100%;text-align:left;
    padding:16px;margin-bottom:10px;font-size:1.05rem;border-radius:10px;
  }
  .choice .tag{width:30px;height:30px;flex:0 0 30px;border-radius:7px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:.85rem}
  .choice[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .status{padding:12px 14px;border-radius:10px;background:var(--accent-soft);color:#7d3a1f;font-size:.92rem;margin-bottom:16px}
  .status.ok{background:#e4efe8;color:var(--ok)}
  .pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:.75rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
  .pill.open{background:#e4efe8;color:var(--ok)}
  .pill.closed{background:#f0ece7;color:var(--muted)}

  /* present mode */
  body.present .hide-present{display:none}
  body.present .wrap{max-width:1100px;padding-top:32px}
  body.present .qtext{font-size:2.6rem;margin-bottom:34px}
  body.present .bar-top{font-size:1.5rem}
  body.present .bar-label .tag{width:32px;height:32px;flex:0 0 32px;font-size:1rem}
  body.present .track{height:26px;border-radius:13px}
  body.present .fill{border-radius:13px}
  body.present .bar{margin-bottom:24px}
  body.present .total{font-size:1.2rem}
  body.present .panel{border:none;background:transparent;padding:0}
  body.present .total{margin-bottom:70px}
  .exit-present{position:fixed;bottom:14px;right:14px;z-index:9;display:none;opacity:.4;font-size:.85rem}
  .exit-present:hover{opacity:1}
  body.present .exit-present{display:block}
  /* small join reminder for latecomers, present mode only */
  #joinbadge{display:none;position:fixed;bottom:14px;left:14px;z-index:9;
    align-items:center;gap:10px;color:var(--muted);font-size:.85rem}
  #joinbadge canvas,#joinbadge img{width:64px;height:64px;display:block;border-radius:4px}
  #joinbadge b{color:var(--ink);font:600 1rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em}
  body.present #joinbadge{display:flex}

  code.inline{background:#f0ece7;padding:1px 5px;border-radius:4px;font-size:.85em}
  .setup li{margin-bottom:10px}
  @media (max-width:520px){ .wrap{padding:16px 14px 56px} .qtext{font-size:1.25rem} }
</style>
</head>
<body>

<button class="exit-present ghost" onclick="setPresent(false)">Exit present mode</button>
<div id="joinbadge"><div id="qrmini"></div><div>join at<br><b id="badgecode"></b></div></div>
<div class="wrap" id="app"><p class="muted">Loading…</p></div>

<script type="module">
const app  = document.getElementById("app");
const SDK  = "https://www.gstatic.com/firebasejs/10.12.2/";

function fatal(title, detail){
  app.innerHTML = `<h1>${title}</h1><p class="sub">${detail}</p>`;
}
const BARS = ["var(--bar1)","var(--bar2)","var(--bar3)","var(--bar4)","var(--bar5)","var(--bar6)","var(--bar7)","var(--bar8)"];
const LETTERS = "ABCDEFGHIJKLMNOP";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

window.setPresent = on => { document.body.classList.toggle("present", !!on); };

/* ---------- guard: config not filled in yet ---------- */
if (!window.FIREBASE_CONFIG || String(window.FIREBASE_CONFIG.apiKey).includes("PASTE_ME")) {
  app.innerHTML = `
    <h1>Live Poll — one more step</h1>
    <p class="sub">The app is installed, but it needs a (free) Firebase project to store votes.</p>
    <div class="panel setup">
      <ol>
        <li>Go to <code class="inline">console.firebase.google.com</code> and create a project (no billing needed).</li>
        <li>Build &rarr; <b>Firestore Database</b> &rarr; Create database &rarr; production mode.</li>
        <li>Build &rarr; <b>Authentication</b> &rarr; Get started &rarr; enable <b>Anonymous</b>.</li>
        <li>Project settings &rarr; <b>Your apps</b> &rarr; Web (<code class="inline">&lt;/&gt;</code>) &rarr; copy the <code class="inline">firebaseConfig</code> object.</li>
        <li>Paste it into the <code class="inline">FIREBASE_CONFIG</code> block near the top of <code class="inline">index.html</code>, then push.</li>
        <li>Paste the security rules from <code class="inline">firestore.rules</code> into Firestore &rarr; Rules &rarr; Publish.</li>
      </ol>
      <p class="muted">Those config values are safe to publish — access is controlled by the security rules, not by hiding them.</p>
    </div>`;
  throw new Error("config");
}

/* ---------- firebase (loaded dynamically so a network failure
              shows a message instead of a blank page) ---------- */
let initializeApp, getAuth, signInAnonymously, onAuthStateChanged,
    getFirestore, doc, getDoc, setDoc, updateDoc, getDocs,
    collection, onSnapshot, writeBatch;
try {
  ({ initializeApp } = await import(SDK + "firebase-app.js"));
  ({ getAuth, signInAnonymously, onAuthStateChanged } = await import(SDK + "firebase-auth.js"));
  ({ getFirestore, doc, getDoc, setDoc, updateDoc, getDocs,
     collection, onSnapshot, writeBatch } = await import(SDK + "firebase-firestore.js"));
} catch (e) {
  fatal("Can't reach Firebase",
        "The page loaded but couldn't download the Firebase library. Check the network connection and reload.");
  throw e;
}

const fb   = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(fb);
const db   = getFirestore(fb);

let uid = null;
const ready = new Promise((resolve, reject) => {
  onAuthStateChanged(auth, u => { if (u) { uid = u.uid; resolve(u); } });
  signInAnonymously(auth).catch(reject);
});

const pollRef  = code => doc(db, "polls", code);
const votesRef = code => collection(db, "polls", code, "votes");

function newCode(){
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from({length:4}, () => A[Math.floor(Math.random()*A.length)]).join("");
}
function baseUrl(){ return location.origin + location.pathname; }
function joinUrl(code){ return baseUrl() + "#p/" + code; }

function tally(poll, voteDocs){
  const n = (poll.options || []).length;
  const counts = new Array(n).fill(0);
  let total = 0;
  for (const v of voteDocs) {
    const c = v.choice;
    if (Number.isInteger(c) && c >= 0 && c < n) { counts[c]++; total++; }
  }
  return { counts, total };
}

function resultsHTML(poll, counts, total){
  const max = Math.max(1, ...counts);
  const bars = (poll.options || []).map((opt, i) => {
    const pct = total ? Math.round(counts[i] / total * 100) : 0;
    return `<div class="bar">
      <div class="bar-top">
        <span class="bar-label">
          <span class="tag" style="background:${BARS[i % BARS.length]}">${LETTERS[i]}</span>
          <span>${esc(opt)}</span>
        </span>
        <span class="bar-num"><b>${counts[i]}</b> · ${pct}%</span>
      </div>
      <div class="track"><div class="fill" style="width:${(counts[i]/max*100).toFixed(1)}%;background:${BARS[i % BARS.length]}"></div></div>
    </div>`;
  }).join("");
  return `<div class="qtext">${esc(poll.question || "Untitled question")}</div>
          ${bars}
          <div class="total">${total} response${total === 1 ? "" : "s"}</div>`;
}

/* ==================================================================== */
/*  TEACHER CONSOLE                                                     */
/* ==================================================================== */
async function teacher(code){
  await ready;

  app.innerHTML = `
    <div class="hide-present">
      <div class="row" style="justify-content:space-between;margin-bottom:4px">
        <h1>Live Poll · ${code}</h1>
        <div class="row">
          <button class="ghost" id="present">Present</button>
          <button class="ghost" id="brand-new">New poll</button>
        </div>
      </div>
      <p class="sub">Keep this page. Students only ever see the join link.</p>

      <div class="panel">
        <div class="join">
          <div id="qr"></div>
          <div>
            <label>Students join at</label>
            <div class="code">${code}</div>
            <div class="url" id="url">${esc(joinUrl(code))}</div>
            <div class="row" style="margin-top:10px">
              <button class="ghost" id="copy">Copy link</button>
              <button class="ghost" id="openstu">Open student view</button>
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>Question</h2>
        <label for="q">Prompt</label>
        <textarea id="q" placeholder="e.g. Which term dominates the variance of a polygenic trait?"></textarea>
        <div style="height:14px"></div>
        <label>Answer options</label>
        <div id="opts"></div>
        <div class="row" style="margin-top:10px">
          <button class="ghost" id="addopt">+ Add option</button>
          <button class="primary" id="save">Save question</button>
          <span class="muted" id="savemsg"></span>
        </div>
      </div>

      <div class="panel">
        <div class="row" style="justify-content:space-between">
          <div class="row">
            <span id="statepill" class="pill closed">closed</span>
            <span class="muted" id="livecount">0 responses</span>
          </div>
          <div class="row">
            <button id="toggle">Open voting</button>
            <button class="ghost" id="reset">Clear votes</button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel" id="results"><p class="muted">No votes yet.</p></div>`;

  document.getElementById("badgecode").textContent = code;
  if (typeof QRCode === "function") {
    new QRCode(document.getElementById("qr"), {
      text: joinUrl(code), width: 148, height: 148,
      colorDark: "#1a1a19", colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
    new QRCode(document.getElementById("qrmini"), {
      text: joinUrl(code), width: 128, height: 128,
      colorDark: "#1a1a19", colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  } else {
    document.getElementById("qr").innerHTML =
      `<p class="muted" style="line-height:1.5;margin:0;max-width:140px">QR library didn't load — share the link instead.</p>`;
  }

  document.getElementById("present").onclick  = () => setPresent(true);
  document.getElementById("openstu").onclick  = () => window.open(joinUrl(code), "_blank");
  document.getElementById("brand-new").onclick = () => { location.hash = "#t/" + newCode(); location.reload(); };
  document.getElementById("copy").onclick = async e => {
    try { await navigator.clipboard.writeText(joinUrl(code)); e.target.textContent = "Copied"; }
    catch { e.target.textContent = "Copy failed"; }
    setTimeout(() => e.target.textContent = "Copy link", 1500);
  };

  /* option editor */
  const optsEl = document.getElementById("opts");
  function drawOpts(values){
    optsEl.innerHTML = values.map((v, i) => `
      <div class="opt-row">
        <span class="tag" style="background:${BARS[i % BARS.length]}">${LETTERS[i]}</span>
        <input type="text" value="${esc(v)}" data-i="${i}" placeholder="Option ${LETTERS[i]}">
        <button class="ghost" data-del="${i}" title="Remove">&times;</button>
      </div>`).join("");
    optsEl.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
      const vals = readOpts(); vals.splice(+b.dataset.del, 1);
      drawOpts(vals.length ? vals : [""]);
    });
  }
  const readOpts = () => [...optsEl.querySelectorAll("input")].map(i => i.value);
  document.getElementById("addopt").onclick = () => {
    const v = readOpts();
    if (v.length < 8) drawOpts([...v, ""]);
  };

  /* ensure the poll doc exists */
  const snapOnce = await getDoc(pollRef(code));
  if (!snapOnce.exists()) {
    await setDoc(pollRef(code), {
      question: "", options: ["", ""], open: false,
      owner: uid, createdAt: Date.now()
    });
  }

  document.getElementById("save").onclick = async () => {
    const options = readOpts().map(s => s.trim()).filter(Boolean);
    if (options.length < 2) { msg("Need at least two options."); return; }
    await updateDoc(pollRef(code), {
      question: document.getElementById("q").value.trim(),
      options
    });
    msg("Saved.");
  };
  function msg(t){
    const m = document.getElementById("savemsg");
    m.textContent = t; setTimeout(() => m.textContent = "", 2000);
  }

  document.getElementById("toggle").onclick = async e => {
    await updateDoc(pollRef(code), { open: e.target.dataset.open !== "1" });
  };

  document.getElementById("reset").onclick = async () => {
    const snap = await getDocs(votesRef(code));
    const batch = writeBatch(db);
    snap.forEach(d => batch.delete(d.ref));
    await batch.commit();
  };

  /* live state */
  let poll = { question:"", options:[], open:false };
  let votes = [];
  let editorSeeded = false;

  onSnapshot(pollRef(code), s => {
    if (!s.exists()) return;
    poll = s.data();
    if (!editorSeeded) {
      document.getElementById("q").value = poll.question || "";
      drawOpts((poll.options && poll.options.length) ? poll.options : ["", ""]);
      editorSeeded = true;
    }
    const t = document.getElementById("toggle");
    const p = document.getElementById("statepill");
    t.dataset.open = poll.open ? "1" : "0";
    t.textContent = poll.open ? "Close voting" : "Open voting";
    t.className = poll.open ? "" : "primary";
    p.textContent = poll.open ? "open" : "closed";
    p.className = "pill " + (poll.open ? "open" : "closed");
    render();
  });

  onSnapshot(votesRef(code), s => {
    votes = s.docs.map(d => d.data());
    render();
  });

  // Rebuild the results block only when the QUESTION changes; when just
  // the numbers move, update in place so the bars animate instead of
  // flashing (matters a lot on a projector).
  let shape = null;
  function render(){
    const { counts, total } = tally(poll, votes);
    const box = document.getElementById("results");
    document.getElementById("livecount").textContent =
      `${total} response${total === 1 ? "" : "s"}`;

    if (!poll.options || !poll.options.length) {
      shape = null;
      box.innerHTML = `<p class="muted">Add a question and some options above.</p>`;
      return;
    }
    const nextShape = JSON.stringify([poll.question, poll.options]);
    if (nextShape !== shape) {
      shape = nextShape;
      box.innerHTML = resultsHTML(poll, counts, total);
      return;
    }
    const max = Math.max(1, ...counts);
    box.querySelectorAll(".bar").forEach((bar, i) => {
      const pct = total ? Math.round(counts[i] / total * 100) : 0;
      bar.querySelector(".fill").style.width = (counts[i] / max * 100).toFixed(1) + "%";
      bar.querySelector(".bar-num").innerHTML = `<b>${counts[i]}</b> · ${pct}%`;
    });
    box.querySelector(".total").textContent =
      `${total} response${total === 1 ? "" : "s"}`;
  }
}

/* ==================================================================== */
/*  STUDENT VIEW                                                        */
/* ==================================================================== */
async function student(code){
  await ready;
  app.innerHTML = `<div id="s"><p class="muted">Connecting…</p></div>`;
  const el = document.getElementById("s");

  let poll = null, mine = null, votes = [];

  onSnapshot(pollRef(code), s => {
    if (!s.exists()) {
      el.innerHTML = `<h1>Poll not found</h1><p class="sub">Check the code with your instructor.</p>`;
      return;
    }
    poll = s.data(); draw();
  });
  onSnapshot(doc(db, "polls", code, "votes", uid), s => {
    mine = s.exists() ? s.data().choice : null; draw();
  });
  onSnapshot(votesRef(code), s => { votes = s.docs.map(d => d.data()); draw(); });

  async function vote(i){
    if (!poll || !poll.open) return;
    await setDoc(doc(db, "polls", code, "votes", uid), { choice: i, at: Date.now() });
  }
  window.__vote = vote;

  // Re-render only when something this student can SEE changes. Without
  // this the page would rebuild on every incoming vote from the room,
  // and a tap could land on a button that was just replaced.
  let sig = null;
  function draw(){
    if (!poll) return;
    const opts = poll.options || [];
    const next = poll.open
      ? JSON.stringify(["open", poll.question, opts, mine])
      : JSON.stringify(["closed", poll.question, opts, tally(poll, votes).counts]);
    if (next === sig) return;
    sig = next;

    if (!poll.open) {
      const { counts, total } = tally(poll, votes);
      el.innerHTML = total
        ? `<div class="status">Voting is closed — here are the results.</div>${resultsHTML(poll, counts, total)}`
        : `<div class="status">Voting isn't open yet. This page will update on its own — keep it open.</div>
           <div class="qtext">${esc(poll.question || "")}</div>`;
      return;
    }

    el.innerHTML = `
      ${mine === null
        ? `<div class="status">Pick one answer.</div>`
        : `<div class="status ok">Answer recorded — tap another option to change it.</div>`}
      <div class="qtext">${esc(poll.question || "Question")}</div>
      ${opts.map((o, i) => `
        <button class="choice" aria-pressed="${mine === i}" onclick="__vote(${i})">
          <span class="tag" style="background:${BARS[i % BARS.length]}">${LETTERS[i]}</span>
          <span>${esc(o)}</span>
        </button>`).join("")}`;
  }
}

/* ==================================================================== */
/*  LANDING + ROUTER                                                    */
/* ==================================================================== */
function landing(){
  app.innerHTML = `
    <h1>Live Poll</h1>
    <p class="sub">Start a poll, put the QR code on the projector, watch answers come in.</p>
    <div class="panel">
      <button class="primary" id="start">Start a new poll</button>
    </div>
    <div class="panel">
      <label for="jc">Joining as a student?</label>
      <div class="row">
        <input type="text" id="jc" placeholder="4-letter code" maxlength="4"
               style="max-width:180px;text-transform:uppercase;letter-spacing:.1em">
        <button id="join">Join</button>
      </div>
    </div>`;
  document.getElementById("start").onclick = () => { location.hash = "#t/" + newCode(); };
  document.getElementById("join").onclick = () => {
    const c = document.getElementById("jc").value.trim().toUpperCase();
    if (c.length === 4) location.hash = "#p/" + c;
  };
}

function route(){
  setPresent(false);
  const m = location.hash.match(/^#(t|p)\/([A-Z0-9]{4})$/i);
  if (!m) return landing();
  const mode = m[1].toLowerCase(), code = m[2].toUpperCase();
  (mode === "t" ? teacher : student)(code).catch(e => {
    app.innerHTML = `<h1>Something went wrong</h1>
      <p class="sub">${esc(e && e.message || e)}</p>
      <p class="muted">Most often this means Anonymous sign-in isn't enabled in Firebase
      Authentication, or the Firestore rules haven't been published yet.</p>`;
  });
}

let lastHash = location.hash;
addEventListener("hashchange", () => {
  const m = location.hash.match(/^#t\//), n = lastHash.match(/^#t\//);
  lastHash = location.hash;
  if (m || n) location.reload(); else route();
});
route();
</script>
</body>
</html>
